services:
  mongo:
    image: mongo:latest
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: always

  rabbitmq:
    image: rabbitmq:4.2.4-management
    container_name: rabbit_mq
    expose:
      - "5672"
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: always

  catalogo:
    build: ./comercio-catalogo
    container_name: comercio_catalogo
    depends_on:
      - mongo
      - rabbitmq
    environment:
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI}
    restart: always

  auth:
    build: ./comercio-auth
    container_name: comercio_auth
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    restart: always

  comercio-app:
    build: ./comercio-app
    container_name: comercio_app
    ports:
      - "80:80"
    depends_on:
      - catalogo
      - auth
    restart: always

volumes:
  mongo-data:
  postgres-data:
  rabbitmq-data: